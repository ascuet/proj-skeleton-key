[project]
name = "skeleton-key"
version = "0.1.0"
description = "Skeleton Keys: Estimating Randomized Model Selection Distributions With Limited Queries"
requires-python = ">=3.9"
dependencies = [
    "torch==1.8.0+cu111",
    "torchvision==0.9.0+cu111",
    "numpy<2",
    "scipy",
    "pandas",
    "Pillow",
    "tqdm",
    "ml-collections",
    "requests",
    "spikingjelly==0.0.0.0.14",
    "autoattack @ git+https://github.com/fra31/auto-attack",
    "RandAugment @ git+https://github.com/ildoonet/pytorch-randaugment",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu111" }
torchvision = { index = "pytorch-cu111" }

[[tool.uv.index]]
name = "pytorch-cu111"
url = "https://download.pytorch.org/whl/cu111"
explicit = true
